const methodColors = {"GET": "#10b981", "POST": "#3b82f6", "PUT": "#f59e0b", "DELETE": "#ef4444", "PATCH": "#8b5cf6", "HEAD": "#64748b", "OPTIONS": "#64748b"};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(items) {
  const list = document.getElementById('list');
  list.innerHTML = items.map(e => {
    const params = (e.params && e.params.length) ? `<h4>请求参数</h4><table>
      <tr><th>参数</th><th>位置</th><th>类型</th><th>必填</th><th>说明</th></tr>
      ${e.params.map(p => `<tr><td><code>${esc(p.name)}</code></td><td>${esc(p.in)}</td><td><code>${esc(p.type)}</code></td><td class="${p.required ? 'req-true' : 'req-false'}">${p.required ? '是' : '否'}</td><td>${esc(p.desc)}</td></tr>`).join('')}
    </table>` : '';
    const resp = (e.success && e.success.length) ? `<h4>成功响应</h4><table>
      <tr><th>状态码</th><th>返回类型</th><th>说明</th></tr>
      ${e.success.map(r => `<tr><td>${esc(r.code)}</td><td><code>${esc(r.schema)}</code></td><td>${esc(r.desc)}</td></tr>`).join('')}
    </table>` : '';
    const tags = (e.tags && e.tags.length) ? e.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('') : '';
    return `<div class="endpoint" data-m="${esc(e.method)}">
      <div class="ep-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="method" style="background:${methodColors[e.method] || '#64748b'}">${esc(e.method)}</span>
        <span class="path">${esc(e.path)}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="ep-body">
        <p class="summary">${esc(e.summary)}</p>
        ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ''}
        ${tags ? `<div style="margin:8px 0">${tags}</div>` : ''}
        ${params}${resp}
      </div>
    </div>`;
  }).join('');
}

let methodFilter = 'ALL';
function apply() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const cards = Array.from(document.querySelectorAll('.endpoint'));
  let shown = 0;
  cards.forEach(c => {
    const text = c.textContent.toLowerCase();
    const okMethod = methodFilter === 'ALL' || c.dataset.m === methodFilter;
    const okQuery = !q || text.includes(q);
    const show = okMethod && okQuery;
    c.classList.toggle('hidden', !show);
    if (show) shown++;
  });
  document.getElementById('empty').classList.toggle('hidden', shown > 0);
}

document.getElementById('search').addEventListener('input', apply);
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    methodFilter = btn.dataset.m;
    apply();
  });
});

render(data);
apply();
